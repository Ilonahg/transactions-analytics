[tool.poetry]
name = "transactions-analytics"
version = "0.1.0"
description = "Курсовой проект: анализ транзакций, JSON для веб-страниц, отчёты и сервисы"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2.0"
requests = "^2.32.0"
python-dotenv = "^1.0.1"
openpyxl = "^3.1.2"


[tool.poetry.group.dev.dependencies]
black = "^24.4.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.10.0"
pytest = "^8.2.0"
pytest-cov = "^5.0.0"


[tool.black]
line-length = 119
exclude = ".git|.venv|venv|build|dist"


[tool.isort]
profile = "black"
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|.venv|build|dist"


[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing"
pythonpath = ["."]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"